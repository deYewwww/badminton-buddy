[project]
name = "badminton-hud"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "numpy",
    "scipy",
    "pillow",
    "pandas",
    "pyarrow",
    "lap>=0.5.12",
    "coremltools>=8.0; sys_platform == 'darwin'",
]

[project.scripts]
hud = "hud.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hud"]
