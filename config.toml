# Tunable knobs. Edit, then press 「套用修正並重新輸出」 in the editor (or `hud run --from rallies`).

[colors]  # RGB hex per player
P1 = "#36c8f0"
P2 = "#5be0a0"
P3 = "#b48cff"
P4 = "#ffb050"

[rally]
dead_time_s = 2.5        # after the shuttle lands, ignore "hits" this long (pick-up, toss back)
max_gap_s = 3.0          # two hits further apart than this belong to different rallies
silence_s = 1.0          # no real shuttle sighting this long = play has stopped
flight_gap_s = 0.25      # rally ends where the last shot's track breaks off for this long
max_flight_s = 1.5       # ... and no later than this after the last hit (a high clear's flight)
last_flight_s = 1.2      # ... but at least this long after it unless seen landing (the last flight is mostly lost)
floor_sure_sd = 1.5      # a landing SEEN on the floor calls in/out only this many sd (hits.FLOOR_PX) clear of
                         # the lines: from a 0.7 m phone one pixel is ~0.2 m near the net (ACE: a call 0.9 m
                         # past the net was wrong)
landing_sure_sd = 1.0    # a predicted landing (shuttle lost in the air) decides the point only this many sd from a line
still_s = 1.0            # everyone (>= 3 tracked) slower than still_mps this long: play has stopped
still_mps = 1.0          # (on ACE every such stretch was a serve being set up)
min_shots = 2            # rallies with fewer hits are dropped as noise
pickup_max_shots = 3     # a rally this short with no shot faster than pickup_max_kmh and no player
pickup_max_kmh = 70      # faster than pickup_max_mps is a toss-back, not play (initial shot speed;
pickup_max_mps = 1.8     # walking ~1.3 m/s, any real rally has someone sprinting)
serve_answer_s = 1.25    # a rally's first hit must be answered this fast, else it was pre-serve fiddling
                         # (tuned on 3 rallies of one clip; raise it if long high serves get dropped)

[shuttle]
# Skip TrackNet (the slowest step) in dead time: >= 3 players tracked and nobody faster than
# idle_speed_mps. Set skip_idle = false if rallies go missing, and tell us which clip.
skip_idle = true
idle_speed_mps = 1.8     # walking ~1.3 m/s; rally footwork bursts well past 2 m/s
pad_after_s = 2.0        # keep tracking this long after play calms down (last shot still flying)
pad_before_s = 2.0       # ... and start this early before anyone moves again (the serve; the speed
                         # window notices movement ~0.5 s late, so this is ~1.5 s of real margin)
min_skip_s = 1.0         # shorter idle stretches are not worth skipping
yolo_fill = true         # fill TrackNet's short gaps with models/shuttle_yolo.pt when it exists
                         # (scripts/train_shuttle.py trains it); see hud/shuttle_yolo.py
far_pass = true          # second TrackNet pass zoomed on the far court, only where it is small in the
                         # frame (portrait / stabilised / low phone): +~60 % TrackNet time, more far shots

[score]
show = false             # score panel + 得分 banner in the HUD. Off while the analysis focuses on serves,
                         # rally time, shot count, speed and shot type (user, 2026-10-28); the score is still
                         # computed and the editor can still fix it
# score at the start of the video (for videos that begin mid-match)
games_us = 0
games_opp = 0
us = 0
opp = 0
first_server = ""        # "us" / "opp" if known; afterwards the rally winner serves
guess_kill = ["smash"]   # ... except a rally ending on one of these: the hitter won it (a kill)
guess = "last_hitter_loses"  # no landing seen: who gets the point. On the user's ACE run the side that hit
                         # last LOST 6 of 8 rallies (errors into the net / out, and finishing kills too fast
                         # to be detected); "last_hitter_wins" is the other option
target = 21
cap = 30
games_to_win = 2

[stamina]
# HUD 體力: a game-style meter, NOT a physiological measurement. It drains with effort:
#   running faster than walk_mps: -per_mps per second for every m/s above it
#   footwork (stops, push-offs, direction changes): -per_accel per second per m/s^2 above accel_free
#   every stroke: -shot_cost[type]; a jump smash (contact >= jump_z_m) +jump_extra; an attacking
#   stroke (attack) by a player who attacked within streak_s costs streak_step more per stroke
#   in the streak (up to +streak_max): a sustained attack drains fast, a block or lift little
# Standing still (slower than rest_mps) recovers: recover_rally_per_s during a rally (the server,
# a waiting partner), recover_per_s between rallies, up to a ceiling that falls by fatigue x spent.
start = 100
walk_mps = 1.2
per_mps = 0.45
accel_free = 2.0
per_accel = 0.08
rest_mps = 1.0
recover_rally_per_s = 0.3
recover_per_s = 0.8
fatigue = 0.12
shot_cost = { smash = 1.8, drive = 0.7, clear = 0.8, drop = 0.5, net = 0.4, defence = 0.3, other = 0.5 }
attack = ["smash", "drive"]
jump_z_m = 2.6
jump_extra = 0.5
streak_s = 3.0
streak_step = 0.3
streak_max = 1.0

[move]
window_s = 3.0           # MOVE bar = metres covered in the last window_s ...
full_scale_m = 8.0       # ... divided by this (full bar)

[placement]
# rating 0-100 per shot from its landing spot; labels from these floors
perfect = 85
great = 70
good = 50
